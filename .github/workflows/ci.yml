name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # DuckDB's spatial extension (108 MB), which code generation and the tests install.
      - uses: actions/cache@v6
        with:
          path: ~/.duckdb
          key: duckdb-${{ hashFiles('pom.xml') }}
      # Deterministic suite only: no network data, no LLM calls.
      - run: mvn -B -ntp verify
      - run: pipx run --spec sqlfluff==4.5.0 sqlfluff lint src/main/resources/sql
