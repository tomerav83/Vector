name: live-data

# Real downloads from the public sources, checked against the committed lock and hand-verified facts.
# Catches upstream changes (revised or removed files, renamed columns, new airport codes) without
# putting the network on every push. Manual only (Actions tab → Run workflow): GitHub's terms do not allow
# scheduled jobs that pull from third-party sites, and this job never stores or publishes data.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp test -Dgroups=live -DexcludedGroups=none
